    <!-- Script de carga inmediata para evitar destellos de tema -->
    <script>
        (function() {
            let savedTheme = 'light';
            try {
                const storedTheme = localStorage.getItem('theme');
                if (['light', 'dark', 'amoled'].includes(storedTheme)) savedTheme = storedTheme;
            } catch (e) {}

            document.documentElement.classList.toggle('light-mode', savedTheme === 'light');
            document.documentElement.classList.toggle('amoled-mode', savedTheme === 'amoled');
        })();
    </script>

    <!-- Ajuste exclusivo para iPhone/iPad: respeta notch, Dynamic Island y barra inferior
         sin cambiar el diseño de Android ni escritorio. -->
    <script id="ios-safe-area-fix">
        (function () {
            const esIOS =
                /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (!esIOS) return;

            document.documentElement.classList.add('ios-safe-area');

            function aplicarSafeAreaIOS() {
                const body = document.body;
                if (!body) return;

                if (body.dataset.iosSafeAreaCapturada !== '1') {
                    body.dataset.iosPaddingTop = body.style.paddingTop || '';
                    body.dataset.iosPaddingRight = body.style.paddingRight || '';
                    body.dataset.iosPaddingBottom = body.style.paddingBottom || '';
                    body.dataset.iosPaddingLeft = body.style.paddingLeft || '';
                    body.dataset.iosSafeAreaCapturada = '1';
                }

                body.style.paddingTop = body.dataset.iosPaddingTop;
                body.style.paddingRight = body.dataset.iosPaddingRight;
                body.style.paddingBottom = body.dataset.iosPaddingBottom;
                body.style.paddingLeft = body.dataset.iosPaddingLeft;

                const estilos = getComputedStyle(body);

                body.style.paddingTop =
                    `calc(${estilos.paddingTop} + env(safe-area-inset-top, 0px))`;
                body.style.paddingRight =
                    `calc(${estilos.paddingRight} + env(safe-area-inset-right, 0px))`;
                body.style.paddingBottom =
                    `calc(${estilos.paddingBottom} + env(safe-area-inset-bottom, 0px))`;
                body.style.paddingLeft =
                    `calc(${estilos.paddingLeft} + env(safe-area-inset-left, 0px))`;
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', aplicarSafeAreaIOS, { once: true });
            } else {
                aplicarSafeAreaIOS();
            }

            window.addEventListener('orientationchange', function () {
                window.setTimeout(aplicarSafeAreaIOS, 180);
            });
        })();
    </script>

<script>
    function normalizarTemaMesa(tema) {
        return ['light', 'dark', 'amoled'].includes(tema) ? tema : 'light';
    }

    function obtenerTemaActualMesa() {
        if (document.documentElement.classList.contains('amoled-mode')) return 'amoled';
        if (document.documentElement.classList.contains('light-mode')) return 'light';
        return 'dark';
    }

    function actualizarTemaMesa() {
        const boton = document.getElementById('mesa-theme-toggle');
        if (!boton) return;
        const temaActual = obtenerTemaActualMesa();
        const temas = {
            light: { icono: '☀️', etiqueta: 'Claro', siguiente: 'oscuro' },
            dark: { icono: '🌙', etiqueta: 'Oscuro', siguiente: 'negro AMOLED' },
            amoled: { icono: '⚫', etiqueta: 'Negro', siguiente: 'claro' }
        };
        const datosTema = temas[temaActual];
        boton.querySelector('.theme-icon').textContent = datosTema.icono;
        boton.querySelector('.theme-label').textContent = datosTema.etiqueta;
        boton.setAttribute('aria-label', `Cambiar a modo ${datosTema.siguiente}`);
    }

    function aplicarTemaMesa(temaSolicitado, guardar = true) {
        const tema = normalizarTemaMesa(temaSolicitado);
        const esClaro = tema === 'light';
        const esAmoled = tema === 'amoled';

        [document.documentElement, document.body].forEach(elemento => {
            if (!elemento) return;
            elemento.classList.toggle('light-mode', esClaro);
            elemento.classList.toggle('amoled-mode', esAmoled);
        });

        actualizarTemaMesa();

        if (guardar) {
            try {
                localStorage.setItem('theme', tema);
                localStorage.removeItem('domino_tema');
            } catch (e) {}
        }
    }

    function cambiarTema() {
        const ordenTemas = ['light', 'dark', 'amoled'];
        const temaActual = obtenerTemaActualMesa();
        const siguienteTema = ordenTemas[(ordenTemas.indexOf(temaActual) + 1) % ordenTemas.length];
        aplicarTemaMesa(siguienteTema);

    async function asegurarClienteSupabaseMesa() {
        if (sbClient) return true;

        if (!window.supabase) {
            if (!promesaClienteSupabaseMesa) {
                promesaClienteSupabaseMesa = new Promise(resolve => {

                    script.async = true;
                    script.onload = () => resolve(true);
                    script.onerror = () => resolve(false);
                    document.head.appendChild(script);
                }).finally(() => {
                    promesaClienteSupabaseMesa = null;
                });
            }
            await promesaClienteSupabaseMesa;
        }

        if (window.supabase && !sbClient) {
            sbClient =
                window.supabaseClient ||
                window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            if (!window.supabaseClient && sbClient) {
                window.supabaseClient = sbClient;
            }

            perfilActualMesaCargado = false;
        }

        return Boolean(sbClient);
    }

    function programarCargaRealtimeMesa(delay = 80) {
        if (temporizadorCargaRealtimeMesa) {
            clearTimeout(temporizadorCargaRealtimeMesa);

        temporizadorCargaRealtimeMesa = setTimeout(() => {

    function limpiarCanalRealtimeMesa(canal = canalManosMesa) {
        if (!canal) return;

        if (canalManosMesa === canal) {
            canalManosMesa = null;
        }

        try {
            sbClient?.removeChannel(canal);
        } catch (_) {}
    }

    function programarReconexionRealtimeMesa() {
        if (
            reintentoRealtimeMesa ||
            !navigator.onLine ||
            !mesaId ||
            document.visibilityState === 'hidden'
        ) {
            return;
        }

        reintentoRealtimeMesa = setTimeout(async () => {
            reintentoRealtimeMesa = null;

            const disponible = await asegurarClienteSupabaseMesa();
            if (!disponible) return;

            activarRealtimeMesa(true);
        }, 1200);
    }

    function activarRealtimeMesa(forzar = false) {
        if (!sbClient || !mesaId) return;

        if (canalManosMesa && !forzar) return;

        if (forzar && canalManosMesa) {
            limpiarCanalRealtimeMesa(canalManosMesa);
        }

        estadoRealtimeMesa = 'CONECTANDO';
        actualizarBadgeSincronizacionMesa();

        const canalActual = sbClient
            .channel(`mesa-${mesaId}-${Math.random().toString(36).slice(2, 8)}`)
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'manos',
                filter: `mesa_id=eq.${mesaId}`
            }, payload => {
                // Si otro dispositivo cambia una mano mientras este usuario está
                // escribiendo puntos, obligamos a revisar antes de guardar.
                if (!guardandoMano && hayPuntosEscritosMesa()) {
                    cambioRemotoMientrasEscribia = true;
                    mostrarAvisoCambioRemotoMesa();
                }

                // Agrupa INSERT/UPDATE que lleguen casi al mismo tiempo.
                programarCargaRealtimeMesa(60);
            })
            .on('postgres_changes', {
                event: 'UPDATE',
                schema: 'public',
                table: 'mesas',
                filter: `id=eq.${mesaId}`
            }, () => {
                programarCargaRealtimeMesa(60);
            });

        canalManosMesa = canalActual;

        canalActual.subscribe(status => {
            // Ignoramos callbacks de un canal viejo que ya fue reemplazado.
            if (canalManosMesa !== canalActual && status !== 'CLOSED') return;

            estadoRealtimeMesa = status;
            actualizarBadgeSincronizacionMesa();

            if (status === 'SUBSCRIBED') {
                if (reintentoRealtimeMesa) {
                    clearTimeout(reintentoRealtimeMesa);
                    reintentoRealtimeMesa = null;
                }

                // Al reconectar, verificamos inmediatamente si nos perdimos una mano.
                revisarCambiosMesaRespaldo();
                return;
            }

            if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) {
                if (canalManosMesa === canalActual) {
                    canalManosMesa = null;
                }

                try {
                    sbClient?.removeChannel(canalActual);
                } catch (_) {}

                programarReconexionRealtimeMesa();
            }
        });
    }

    function crearFirmaManosMesa(manos) {
        return (manos || [])
            .map(m => [
                m.id || '',
                Number(m.puntos_pareja1 || 0),
                Number(m.puntos_pareja2 || 0),
                m.anulada ? 1 : 0,
                m.creado_en || m.created_at || ''
            ].join(':'))
            .join('|');
    }

    async function revisarCambiosMesaRespaldo() {
        if (
            !sbClient ||
            !mesaId ||
            !navigator.onLine ||
            document.visibilityState === 'hidden' ||
            guardandoMano ||
            sincronizandoManos
        ) {
            return;
        }

        try {
            const { data, error } = await sbClient
                .from('manos')
                .select('id,puntos_pareja1,puntos_pareja2,anulada,creado_en,created_at')
                .eq('mesa_id', mesaId)
                .order('creado_en', { ascending: true });

            if (error) throw error;

            const nuevaFirma = crearFirmaManosMesa(data || []);

            if (firmaManosMesa && nuevaFirma === firmaManosMesa) {
                return;
            }

            firmaManosMesa = nuevaFirma;
            await cargarMesa();
        } catch (error) {
            console.warn('[MESA] Revisión de respaldo falló; se intentará reconectar Realtime.', error);
            programarReconexionRealtimeMesa();
        }
    }

    async function manejarConexionRestauradaMesa() {
        if (restaurandoConexionMesa || !navigator.onLine || !mesaId) return;
        restaurandoConexionMesa = true;

        try {
            const clienteDisponible = await asegurarClienteSupabaseMesa();
            if (!clienteDisponible) return;
            await cargarMesa();
            await intentarSincronizacionPendiente();

            if (!canalManosMesa || estadoRealtimeMesa !== 'SUBSCRIBED') {
                activarRealtimeMesa(true);
            }
        } finally {
            restaurandoConexionMesa = false;
        }
    }

    function hayErrorDeRed(error) {
        const mensaje = String(
            (error && (error.message || error.details || error.hint)) || error || ''
        ).toLowerCase();

        return !navigator.onLine ||
            mensaje.includes('failed to fetch') ||
            mensaje.includes('network') ||
            mensaje.includes('networkerror') ||
            mensaje.includes('fetch failed') ||
            mensaje.includes('load failed') ||
            mensaje.includes('offline');
    }

    function leerColaManosOffline() {
        try {
            const cola = JSON.parse(localStorage.getItem(offlineQueueKey) || '[]');

    function guardarColaManosOffline(cola) {

    }

    function actualizarBadgeSincronizacionMesa() {

    async function intentarSincronizacionPendiente() {
        if (!sbClient || !mesaId || !navigator.onLine || sincronizandoManos) return;

        const cola = leerColaManosOffline();
        if (cola.length === 0) return;

        await sincronizarManosOffline();
    }

    async function sincronizarManosOffline() {
        if (sincronizandoManos || !navigator.onLine || !sbClient) return;

        let colaOffline = leerColaManosOffline();
        if (colaOffline.length === 0) return;

        // Si existe un conflicto pendiente, no seguimos enviando automáticamente
        // las manos posteriores porque deben revisarse en orden.
        if (colaOffline.some(m => m?.estado_conflicto)) {
            actualizarBadgeSincronizacionMesa();
            return;
        }

        sincronizandoManos = true;
        actualizarBadgeSincronizacionMesa();
        console.log('Conexión disponible. Sincronizando', colaOffline.length, 'mano(s) pendiente(s)...');

        try {
            let indice = 0;

            while (indice < colaOffline.length) {
                const mano = { ...colaOffline[indice] };

                if (!mano.submission_id) mano.submission_id = generarSubmissionIdMano();
                if (!Number.isFinite(Number(mano.version_esperada))) {
                    mano.version_esperada = Number(versionMesaActual || 0) + indice;
                }

                const { data, error } = await sbClient.rpc('registrar_mano_segura', {
                    p_mesa_id: mesaId,
                    p_puntos_pareja1: Number(mano.puntos_pareja1 || 0),
                    p_puntos_pareja2: Number(mano.puntos_pareja2 || 0),
                    p_version_esperada: Number(mano.version_esperada),
                    p_submission_id: mano.submission_id,
                    p_creado_en: mano.creado_en || mano.fecha_guardado_local || new Date().toISOString()
                });

                if (error) {
                    if (hayErrorDeRed(error)) break;

                    mano.estado_conflicto = true;
                    mano.mensaje_conflicto = error.message || 'No se pudo sincronizar esta mano.';
                    colaOffline[indice] = mano;
                    guardarColaManosOffline(colaOffline);
                    mostrarAvisoCambioRemotoMesa();
                    break;
                }

                if (data?.success === false) {
                    const codigo = String(data.codigo || '');

                    if (codigo === 'CONFLICTO_VERSION' || codigo === 'MESA_CERRADA' || codigo === 'PARTIDA_FINALIZADA') {
                        mano.estado_conflicto = true;
                        mano.mensaje_conflicto = data.mensaje || 'La mesa cambió antes de sincronizar esta mano.';
                        mano.version_actual_conflicto = data.version_actual;
                        colaOffline[indice] = mano;
                        guardarColaManosOffline(colaOffline);
                        await cargarMesa();
                        mostrarAvisoCambioRemotoMesa();
                        break;
                    }

                    mano.estado_conflicto = true;
                    mano.mensaje_conflicto = data?.mensaje || 'Supabase rechazó esta mano.';
                    colaOffline[indice] = mano;
                    guardarColaManosOffline(colaOffline);
                    break;
                }

                if (Number.isFinite(Number(data?.version_nueva))) {
                    versionMesaActual = Number(data.version_nueva);
                }

                colaOffline.splice(indice, 1);
                guardarColaManosOffline(colaOffline);
            }

            if (colaOffline.length === 0) {
                window.AppOffline?.showNotice('Las manos pendientes se sincronizaron correctamente.');
            }

            await cargarMesa();
        } catch (err) {
            console.error('Fallo inesperado al sincronizar manos pendientes:', err);
        } finally {
            sincronizandoManos = false;
            actualizarBadgeSincronizacionMesa();
        }
    }

            lisaBox.classList.remove('hidden');

            sonidoChiva.currentTime = 0;
            sonidoChiva.play().catch(err => console.log('Audio bloqueado:', err));

            setTimeout(() => {
                lisaBox.classList.add('hidden');
                lisaBox.innerHTML = '';
            }, 7000);
        }
    }


    async function obtenerPerfilActualMesa() {
        if (perfilActualMesaCargado) return perfilActualMesa;

        perfilActualMesaCargado = true;

        try {
            const { data: { session } } = await sbClient.auth.getSession();

            if (!session?.user) {
                perfilActualMesa = null;
                return null;
            }

            const { data: p, error } = await sbClient
                .from('perfiles')
                .select('id,rol')
                .eq('auth_user_id', session.user.id)
                .maybeSingle();

            if (error) {
                console.warn('No se pudo resolver el perfil actual:', error);
                perfilActualMesa = null;
                return null;
            }

            perfilActualMesa = p || null;
            return perfilActualMesa;

        } catch (error) {
            console.warn('No se pudo resolver el perfil actual:', error);
            perfilActualMesa = null;
            return null;
        }
    }

    let secuenciaCargaMesa = 0;

    // Evita varias cargas completas simultáneas cuando llegan eventos Realtime
    // muy seguidos. Si ocurre otro cambio durante una carga, hace exactamente
    // una segunda pasada al terminar.
    async function cargarMesa() {
        if (!mesaId) return;

        if (promesaCargaMesaActiva) {
            recargaMesaPendiente = true;
            return promesaCargaMesaActiva;
        }

        do {
            recargaMesaPendiente = false;
            promesaCargaMesaActiva = cargarMesaInterna();

            try {
                await promesaCargaMesaActiva;
            } finally {
                promesaCargaMesaActiva = null;
            }
        } while (recargaMesaPendiente && navigator.onLine);
    }

    async function cargarMesaInterna() {
        if (!mesaId) return;

        const cargaActualMesa = ++secuenciaCargaMesa;

        let currentPerfilId = null;

        if (sbClient) {
            const perfilMesa = await obtenerPerfilActualMesa();
            currentPerfilId = perfilMesa?.id || null;

            const rolMesa = String(perfilMesa?.rol || '').trim().toUpperCase();
            esSuperAdminMesa = ['SUPER_ADMIN','SUPERADMIN'].includes(rolMesa);
        }

        let mesa = null;
        let manosSupabase = [];
        let perfiles = null;

        try {
            const { data: mesaData, error: errMesa } = await sbClient
                .from('mesas')
                .select('*')
                .eq('id', mesaId)
                .single();

            if (errMesa || !mesaData) throw new Error(errMesa ? errMesa.message : 'Mesa no encontrada');
            mesa = mesaData;
            versionMesaActual = Number(mesa.version_mano || 0);

            const { data: manosData, error: errManos } = await sbClient
                .from('manos')
                .select('*')
                .eq('mesa_id', mesaId)
                .order('creado_en', { ascending: true });

            // No reemplazar el último marcador válido por una lista vacía si
            // solamente falla la consulta de manos.
            if (errManos) throw new Error(errManos.message || 'No se pudieron cargar las manos');
            if (manosData) {
                manosSupabase = manosData;
                firmaManosMesa = crearFirmaManosMesa(manosData);
                const validas = manosData.filter(m => !m.anulada);
                ultimaManoServidor = validas.length ? { ...validas[validas.length - 1] } : null;
            }

            const listaJugadores = [mesa.jugador1_id, mesa.jugador2_id, mesa.jugador3_id, mesa.jugador4_id].filter(Boolean);
            if (listaJugadores.length > 0) {
                // AQUÍ SE TOMA EL USERNAME (con respaldo a nombre_completo si estuviera vacío)
                const { data: perfilesData } = await sbClient
                    .from('perfiles')
                    .select('id, username, nombre_completo')
                    .in('id', listaJugadores);
                perfiles = perfilesData;
            }
        } catch (err) {
            console.warn("Modo offline: Cargando datos y manos previas desde caché local...", err.message);
            const cachedMesa = localStorage.getItem(cacheKey);
            if (cachedMesa) {
                try {
                    const parsed = JSON.parse(cachedMesa);
                    if (parsed.manosSupabaseCache) {
                        manosSupabase = parsed.manosSupabaseCache;
                    }
                } catch(e) {}
            }
        }

        let limitePuntos = 200;
        let listaJugadores = [];

        if (mesa) {
            limitePuntos = mesa.limite_puntos || 200;
            listaJugadores = [mesa.jugador1_id, mesa.jugador2_id, mesa.jugador3_id, mesa.jugador4_id].filter(Boolean);
            if (currentPerfilId) esJugadorDeMesa = listaJugadores.includes(currentPerfilId);
            puedeGestionarMesa = esJugadorDeMesa || esSuperAdminMesa;
        } else {
            const cachedMesa = localStorage.getItem(cacheKey);
            if (cachedMesa) {
                try {
                    const parsed = JSON.parse(cachedMesa);
                    if (parsed.meta) limitePuntos = parsed.meta;
                    if (parsed.esJugador !== undefined) esJugadorDeMesa = parsed.esJugador;
                    if (parsed.esSuperAdmin !== undefined) esSuperAdminMesa = parsed.esSuperAdmin;
                    if (parsed.puedeGestionar !== undefined) puedeGestionarMesa = parsed.puedeGestionar;
                    else puedeGestionarMesa = esJugadorDeMesa || esSuperAdminMesa;
                    if (parsed.nombresJugadoresMesa) nombresJugadoresMesa = parsed.nombresJugadoresMesa;
                } catch(e) {}
            }
        }

        document.getElementById('meta-display').innerText = `Meta: ${limitePuntos} pts`;

        let p1Texto = 'Pareja 1';
        let p2Texto = 'Pareja 2';

        if (perfiles && mesa) {
            const map = {};
            perfiles.forEach(p => {
                // Prioriza el 'username' y usa 'nombre_completo' o 'Jugador' como respaldo
                map[p.id] = p.username || (p.nombre_completo ? p.nombre_completo.split(' ')[0] : 'Jugador');
            });
            
            nombresJugadoresMesa.j1 = map[mesa.jugador1_id] || 'J1';
            nombresJugadoresMesa.j2 = map[mesa.jugador2_id] || 'J2';
            nombresJugadoresMesa.j3 = map[mesa.jugador3_id] || 'J3';
            nombresJugadoresMesa.j4 = map[mesa.jugador4_id] || 'J4';

            p1Texto = `${nombresJugadoresMesa.j1} / ${nombresJugadoresMesa.j3}`;
            p2Texto = `${nombresJugadoresMesa.j2} / ${nombresJugadoresMesa.j4}`;
        } else {
            const cachedMesa = localStorage.getItem(cacheKey);
            if (cachedMesa) {
                try {
                    const parsed = JSON.parse(cachedMesa);
                    if (parsed.p1Nombres) p1Texto = parsed.p1Nombres;
                    if (parsed.p2Nombres) p2Texto = parsed.p2Nombres;
                } catch(e) {}
            }
        }

        document.getElementById('p1-nombres').innerText = p1Texto;
        document.getElementById('p2-nombres').innerText = p2Texto;

        document.getElementById('input-p1').placeholder = `Pts de ${nombresJugadoresMesa.j1} y ${nombresJugadoresMesa.j3}`;
        document.getElementById('input-p2').placeholder = `Pts de ${nombresJugadoresMesa.j2} y ${nombresJugadoresMesa.j4}`;

        const manosOffline = leerColaManosOffline();
        let manosCombinadas = [...manosSupabase];
        
        manosOffline.forEach((mo, idx) => {
            manosCombinadas.push({
                ...mo,
                id: 'offline_' + idx,
                indiceColaLocal: idx,
                es_local_pend: true
            });
        });

        let scoreP1 = 0;
        let scoreP2 = 0;
        const tbody = document.getElementById('lista-manos');
        tbody.innerHTML = '';

        manosCombinadas.forEach((m) => {
            // Una mano offline en conflicto NO puede alterar el marcador hasta
            // que el usuario la revise y la vuelva a enviar como mano nueva.
            if (!m.anulada && !m.estado_conflicto) {
                scoreP1 += (m.puntos_pareja1 || 0);
                scoreP2 += (m.puntos_pareja2 || 0);
            }
        });

        document.getElementById('p1-score').innerText = scoreP1;
        document.getElementById('p2-score').innerText = scoreP2;

        juegoFinalizado = scoreP1 >= limitePuntos || scoreP2 >= limitePuntos;
        const winnerBox = document.getElementById('winner-box');
        const statusBadge = document.getElementById('status-badge');

        if (juegoFinalizado) {
            let ganador = scoreP1 >= limitePuntos ? `🏆 ¡Ganó ${p1Texto} (${scoreP1} pts)!` : `🏆 ¡Ganó ${p2Texto} (${scoreP2} pts)!`;
            winnerBox.innerText = ganador;
            winnerBox.classList.remove('hidden');
            statusBadge.innerText = '• FINALIZADO';
            statusBadge.style.color = '#ef4444';

            // ==================================================
            // LISA
            // Solo existe cuando TERMINA la partida y la pareja
            // perdedora quedó en CERO en el marcador acumulado.
            // Se muestra una sola vez por mesa en este dispositivo.
            // ==================================================
            const huboLisa=
                (scoreP1 >= limitePuntos && scoreP2 === 0) ||
                (scoreP2 >= limitePuntos && scoreP1 === 0);

            if (huboLisa) {
                const lisaKey=`lisa_partida_final_${mesaId}`;

                if (!localStorage.getItem(lisaKey)) {
                    localStorage.setItem(lisaKey,'1');

                    if (scoreP1 >= limitePuntos) {
                        dispararAlertaLisa(
                            'Pareja 2',
                            [
                                nombresJugadoresMesa.j2,
                                nombresJugadoresMesa.j4
                            ]
                        );
                    } else {
                        dispararAlertaLisa(
                            'Pareja 1',
                            [
                                nombresJugadoresMesa.j1,
                                nombresJugadoresMesa.j3
                            ]
                        );
                    }
                }
            }

            // Una mano local todavía no confirmada no debe cerrar la mesa en
            // Supabase. El cierre se procesa cuando toda la cola ya se guardó.
            if (mesa && navigator.onLine && manosOffline.length === 0) {
                let mesaCerradaAhora = false;

                if (mesa.estado !== 'cerrada') {
                    const { data: mesaCerrada, error: errCierre } = await sbClient
                        .from('mesas')
                        .update({ estado: 'cerrada' })
                        .eq('id', mesaId)
                        .neq('estado', 'cerrada')
                        .select('id')
                        .maybeSingle();

                    if (errCierre) {
                        console.error('[MESA] Error cerrando mesa:', errCierre);
                    } else if (mesaCerrada) {
                        mesaCerradaAhora = true;
                        mesa.estado = 'cerrada';
                    }
                }

                // El Elo se reconstruye una sola vez: cuando esta carga
                // cambia la mesa de abierta a cerrada tras la mano decisiva.
                if (mesaCerradaAhora) {
                    const { data: resultadoElo, error: errorElo } = await sbClient
                        .rpc('recalcular_elo');

                    if (errorElo) {
                        console.warn('[ELO] No se pudo recalcular al cerrar la partida:', errorElo);
                    } else if (resultadoElo?.success === false) {
                        console.warn('[ELO] Supabase rechazó el recálculo:', resultadoElo);
                    } else {
                        console.log('[ELO] Recalculado al finalizar la partida:', resultadoElo);
                    }
                }

                // ==================================================
                // TORNEOS V3
                // El trigger de Supabase ya procesa el resultado al
                // guardar la mano decisiva. Esta llamada es solo un
                // respaldo idempotente al mostrar la mesa finalizada.
                // ==================================================
                const { data: resultadoV2, error: errorV2 } = await sbClient
                    .rpc('torneo_v2_procesar_mesa', { p_mesa_id: mesaId });

                if (errorV2) {
                    console.warn('[TORNEOS V3] No se pudo comprobar el resultado:', errorV2);
                } else if (resultadoV2?.success === false) {
                    console.warn('[TORNEOS V3] Resultado rechazado:', resultadoV2);
                } else {
                    console.log('[TORNEOS V3] Resultado comprobado:', resultadoV2);
                }

                // Compatibilidad temporal con el módulo anterior:
                // si esta mesa NO pertenece a Torneos V2, intentamos
                // procesar únicamente el antiguo Equipo A vs B.
                if (!errorV2 && resultadoV2?.es_torneo === false) {
                    const { data: resultadoAnterior, error: errorAnterior } = await sbClient
                        .rpc('procesar_mesa_equipo_ab', { p_mesa_id: mesaId });

                    if (errorAnterior) {
                        console.warn('[TORNEOS ANTERIOR] Sin procesamiento adicional:', errorAnterior);
                    } else {
                        console.log('[TORNEOS ANTERIOR] Resultado:', resultadoAnterior);
                    }
                }
            }
        } else {
            winnerBox.classList.add('hidden');
            actualizarBadgeSincronizacionMesa();
        }

        // Si mientras esta carga esperaba a Supabase comenzó otra cargarMesa(),
        // esta respuesta ya es vieja y no debe volver a pintar el historial.
        if (cargaActualMesa !== secuenciaCargaMesa) return;

        const cardAnotar = document.getElementById('card-anotar');
        const spectatorBox = document.getElementById('spectator-box');
        const thAcciones = document.getElementById('th-acciones');

        // ==================================================
        // PERMISOS DE MESA
        // Jugadores de la mesa pueden anotar normalmente.
        // SUPER_ADMIN puede anotar en cualquier mesa aunque no esté sentado.
        // Cuando la meta fue alcanzada/superada, NADIE puede seguir anotando
        // ni anular manos para reducir el marcador.
        // ==================================================
        puedeGestionarMesa = esJugadorDeMesa || esSuperAdminMesa;
        const puedeModificarAhora = puedeGestionarMesa && !juegoFinalizado;
        const puedeCorregirPendientes = puedeGestionarMesa && manosOffline.length > 0;
        const mostrarAcciones = puedeModificarAhora || puedeCorregirPendientes;

        if (puedeModificarAhora) {
            cardAnotar.classList.remove('hidden');
            spectatorBox.classList.add('hidden');
            if (thAcciones) thAcciones.classList.remove('hidden');
        } else {
            cardAnotar.classList.add('hidden');

            if (!puedeGestionarMesa) {
                spectatorBox.textContent = '👁️ Modo Espectador: Solo los jugadores de esta mesa o un SUPER_ADMIN pueden anotar puntos.';
                spectatorBox.classList.remove('hidden');
            } else {
                spectatorBox.classList.add('hidden');
            }

            // Si el final depende de una mano local, mantenemos únicamente la
            // acción necesaria para corregirla antes de sincronizar.
            if (thAcciones) thAcciones.classList.toggle('hidden', !mostrarAcciones);
        }

        const colspanVal = mostrarAcciones ? "4" : "3";
        let historialHTML = '';

        if (manosCombinadas.length === 0) {
            historialHTML = `<tr><td colspan="${colspanVal}" style="color: var(--text-muted); font-size:0.8rem;">Sin manos anotadas.</td></tr>`;
        } else {
            manosCombinadas.forEach((m, idx) => {
                let accionesHTML = mostrarAcciones ? '<td></td>' : '';
                if (mostrarAcciones) {
                    if (m.es_local_pend) {
                        if (m.estado_conflicto) {
                            accionesHTML = `<td><div class="action-btns"><button class="btn-icon" type="button" onclick="revisarManoPendiente(${m.indiceColaLocal})" title="Cargar estos puntos para revisarlos como una posible mano nueva">↻ Revisar</button><button class="btn-icon btn-annul" type="button" onclick="eliminarManoPendiente(${m.indiceColaLocal})" title="Descartar esta mano en conflicto">✕</button></div></td>`;
                        } else {
                            accionesHTML = `<td><button class="btn-icon btn-annul" type="button" onclick="eliminarManoPendiente(${m.indiceColaLocal})" title="Eliminar mano pendiente antes de sincronizar">✕ Pendiente</button></td>`;
                        }
                    } else if (m.anulada && puedeModificarAhora) {
                        accionesHTML = `<td><span style="font-size: 0.75rem; color: var(--text-muted);">Anulada</span></td>`;
                    } else if (puedeModificarAhora) {
                        accionesHTML = `
                            <td>
                                <div class="action-btns">
                                    <button class="btn-icon btn-annul" type="button" onclick="anularMano('${m.id}')" title="Anular mano">🚫</button>
                                </div>
                            </td>
                        `;
                    }
                }

                historialHTML += `
                    <tr class="${m.anulada ? 'mano-anulada' : ''}" ${m.estado_conflicto ? 'style="outline:1px solid rgba(239,68,68,.45);"' : ''}>
                        <td>#${idx + 1}${m.estado_conflicto ? '<br><small style="color:#ef4444;font-weight:900">⚠ REVISAR</small>' : ''}</td>
                        <td style="font-weight: bold;">${m.puntos_pareja1 || 0} pts</td>
                        <td style="font-weight: bold;">${m.puntos_pareja2 || 0} pts</td>
                        ${accionesHTML}
                    </tr>
                `;
            });
        }

        // Una sola escritura al DOM evita que dos cargas concurrentes
        // mezclen/dupliquen las mismas manos.
        tbody.innerHTML = historialHTML;

        try {
            const cacheData = {
                meta: limitePuntos,
                p1Nombres: p1Texto,
                p2Nombres: p2Texto,
                scoreP1: scoreP1,
                scoreP2: scoreP2,
                manosHTML: tbody.innerHTML,
                manosSupabaseCache: manosSupabase,
                nombresJugadoresMesa: { ...nombresJugadoresMesa },
                esJugador: esJugadorDeMesa,
                esSuperAdmin: esSuperAdminMesa,
                puedeGestionar: puedeGestionarMesa,
                juegoFinalizado: juegoFinalizado,
                versionMesaActual: versionMesaActual,
                ultimaManoServidor: ultimaManoServidor
            };
            localStorage.setItem(cacheKey, JSON.stringify(cacheData));
        } catch (err) {
            console.error('Error al guardar caché local:', err);
        }
    }

    function calcularVersionEsperadaParaNuevaManoOffline() {
        const cola = leerColaManosOffline();
        let siguiente = Number(versionMesaActual || 0);

        for (const item of cola) {
            const esperada = Number(item?.version_esperada);
            if (Number.isFinite(esperada)) siguiente = Math.max(siguiente, esperada + 1);
            else siguiente += 1;
        }

        return siguiente;
    }

    async function encolarManoOffline(nuevaMano) {
        const colaOffline = leerColaManosOffline();
        const manoCola = {
            ...nuevaMano,
            submission_id: nuevaMano.submission_id || generarSubmissionIdMano(),
            version_esperada: Number.isFinite(Number(nuevaMano.version_esperada))
                ? Number(nuevaMano.version_esperada)
                : calcularVersionEsperadaParaNuevaManoOffline(),
            fecha_guardado_local: new Date().toISOString(),
            estado_conflicto: false
        };

        colaOffline.push(manoCola);
        guardarColaManosOffline(colaOffline);

        document.getElementById('input-p1').value = '';
        document.getElementById('input-p2').value = '';
        versionInicioAnotacion = null;
        cambioRemotoMientrasEscribia = false;
        window.AppOffline?.showNotice('Mano guardada en este dispositivo. Se validará contra la versión de la mesa al volver Internet.');
        await cargarMesa();
    }

    async function guardarMano(e) {
        e.preventDefault();

        if (guardandoMano) return;

        if (!puedeGestionarMesa || juegoFinalizado) {
            alert('El juego ha finalizado o no tienes permiso para anotar en esta mesa.');
            return;
        }

        const p1Input = document.getElementById('input-p1');
        const p2Input = document.getElementById('input-p2');

        const valP1 = parseInt(p1Input.value) || 0;
        const valP2 = parseInt(p2Input.value) || 0;

        if (valP1 === 0 && valP2 === 0) {
            alert('Ingresa los puntos de una pareja.');
            return;
        }

        // Si Realtime detectó otra mano mientras se estaban escribiendo estos
        // puntos, la primera pulsación solo actualiza y obliga a revisar.
        if (navigator.onLine && (
            cambioRemotoMientrasEscribia ||
            (versionInicioAnotacion !== null && Number(versionInicioAnotacion) !== Number(versionMesaActual))
        )) {
            await cargarMesa();
            cambioRemotoMientrasEscribia = false;
            versionInicioAnotacion = Number(versionMesaActual || 0);
            alert('⚠️ Otro jugador actualizó la mesa mientras escribías. El marcador ya fue actualizado. Revisa tus puntos y pulsa “Anotar Mano” otra vez SOLO si corresponden a una nueva mano.');
            return;
        }

        // Protección contra el error humano: si los mismos puntos acaban de
        // registrarse, no bloqueamos una coincidencia legítima, pero exigimos
        // una confirmación consciente.
        if (navigator.onLine && posibleDuplicadoDeUltimaMano(valP1, valP2)) {
            const confirmarNueva = confirm(
                `⚠️ POSIBLE MANO DUPLICADA\n\nLa última mano registrada también fue ${valP1} - ${valP2}.\n\n¿Estos puntos corresponden realmente a una NUEVA mano?`
            );
            if (!confirmarNueva) return;
        }

        const botonAnotar = document.getElementById('btn-anotar');
        const submissionId = generarSubmissionIdMano();
        const versionEsperada = navigator.onLine
            ? Number(versionInicioAnotacion ?? versionMesaActual ?? 0)
            : calcularVersionEsperadaParaNuevaManoOffline();
        const fechaMano = new Date().toISOString();

        const nuevaMano = {
            mesa_id: mesaId,
            puntos_pareja1: valP1,
            puntos_pareja2: valP2,
            anulada: false,
            creado_en: fechaMano,
            submission_id: submissionId,
            version_esperada: versionEsperada
        };

        guardandoMano = true;
        if (botonAnotar) {
            botonAnotar.disabled = true;
            botonAnotar.textContent = navigator.onLine ? 'Guardando…' : 'Guardando en el dispositivo…';
        }

        try {
            if (!navigator.onLine) {
                await encolarManoOffline(nuevaMano);
                return;
            }

            if (!sbClient) {
                const clienteDisponible = await asegurarClienteSupabaseMesa();
                if (!clienteDisponible) {
                    await encolarManoOffline(nuevaMano);
                    return;
                }
            }

            try {
                const { data, error } = await sbClient.rpc('registrar_mano_segura', {
                    p_mesa_id: mesaId,
                    p_puntos_pareja1: valP1,
                    p_puntos_pareja2: valP2,
                    p_version_esperada: versionEsperada,
                    p_submission_id: submissionId,
                    p_creado_en: fechaMano
                });

                if (error) throw error;

                if (data?.success === false) {
                    const codigo = String(data.codigo || '');

                    if (codigo === 'CONFLICTO_VERSION') {
                        await cargarMesa();
                        cambioRemotoMientrasEscribia = false;
                        versionInicioAnotacion = Number(versionMesaActual || 0);
                        alert('⚠️ Otro jugador anotó o corrigió la mesa antes que tú. Tu mano NO fue guardada. Revisa el marcador; tus puntos siguen escritos.');
                        return;
                    }

                    await cargarMesa();
                    alert(data?.mensaje || 'Supabase no permitió guardar esta mano.');
                    return;
                }

                if (Number.isFinite(Number(data?.version_nueva))) {
                    versionMesaActual = Number(data.version_nueva);
                }

                p1Input.value = '';
                p2Input.value = '';
                versionInicioAnotacion = null;
                cambioRemotoMientrasEscribia = false;
                await cargarMesa();
            } catch (err) {
                // Si la respuesta se perdió pero Supabase sí alcanzó a registrar
                // la mano, submission_id hace que el reintento sea idempotente.
                if (!hayErrorDeRed(err)) {
                    console.error('No se pudo guardar la mano:', err);
                    alert('No se pudo guardar la mano: ' + (err.message || 'error desconocido'));
                    return;
                }

                console.warn('Conexión interrumpida. Guardando la misma operación en cola local...');
                await encolarManoOffline(nuevaMano);
            }
        } finally {
            guardandoMano = false;
            if (botonAnotar) {
                botonAnotar.disabled = false;
                botonAnotar.textContent = 'Anotar Mano';
            }
        }
    }

    async function eliminarManoPendiente(indice) {
        if (!puedeGestionarMesa) return;
        if (sincronizandoManos) {
            window.AppOffline?.showNotice('Espera a que termine la sincronización antes de corregir esta mano.');
            return;
        }

        const cola = leerColaManosOffline();
        if (!Number.isInteger(indice) || indice < 0 || indice >= cola.length) {
            window.AppOffline?.showNotice('La mano pendiente ya no está disponible.');
            await cargarMesa();
            return;
        }

        if (!confirm('¿Eliminar esta mano pendiente? No se enviará al historial cuando vuelva Internet.')) return;

        cola.splice(indice, 1);
        guardarColaManosOffline(cola);
        window.AppOffline?.showNotice('Mano pendiente eliminada.');
        await cargarMesa();
    }

    async function revisarManoPendiente(indice) {
        if (!puedeGestionarMesa || sincronizandoManos) return;

        const cola = leerColaManosOffline();
        if (!Number.isInteger(indice) || indice < 0 || indice >= cola.length) return;

        const mano = cola[indice];
        const ok = confirm(
            `Esta mano no se sincronizó porque la mesa cambió.\n\nPuntos: ${Number(mano.puntos_pareja1 || 0)} - ${Number(mano.puntos_pareja2 || 0)}\n\n¿Quieres cargar estos puntos en el formulario para revisarlos como una posible NUEVA mano?`
        );
        if (!ok) return;

        cola.splice(indice, 1);
        guardarColaManosOffline(cola);

        await cargarMesa();

        document.getElementById('input-p1').value = Number(mano.puntos_pareja1 || 0) || '';
        document.getElementById('input-p2').value = Number(mano.puntos_pareja2 || 0) || '';
        versionInicioAnotacion = Number(versionMesaActual || 0);
        cambioRemotoMientrasEscribia = false;

        window.AppOffline?.showNotice('Puntos cargados. Revisa el marcador y pulsa Anotar Mano solo si corresponden a una nueva mano.');
        document.getElementById('input-p1')?.focus();
    }

    async function anularMano(manoId) {
        // Jugadores asignados y SUPER_ADMIN pueden corregir una mano
        // solamente mientras la partida siga abierta.
        if (!puedeGestionarMesa) return;

        // BLOQUEO DEFINITIVO AL ALCANZAR/SUPERAR LA META:
        // no se permite anular una mano porque reduciría el marcador
        // después de haber terminado oficialmente la partida.
        if (juegoFinalizado) {
            alert('La partida ya alcanzó la meta establecida. Los puntos quedan bloqueados y no se pueden eliminar.');
            return;
        }

        if (String(manoId).startsWith('offline_')) {
            alert('Esta mano está pendiente de sincronización local.');
            return;
        }

        if (!confirm('¿Estás seguro de que deseas anular esta mano?')) {
            return;
        }

        const versionEsperada = Number(versionMesaActual || 0);
        const { data, error } = await sbClient.rpc('anular_mano_segura', {
            p_mano_id: manoId,
            p_version_esperada: versionEsperada
        });

        if (error) {
            console.error('Error al anular:', error.message);
            alert('No se pudo anular la mano: ' + error.message);
            return;
        }

        if (data?.success === false) {
            await cargarMesa();
            alert(data?.mensaje || 'La mesa cambió antes de anular esta mano.');
            return;
        }

        if (Number.isFinite(Number(data?.version_nueva))) {
            versionMesaActual = Number(data.version_nueva);
        }
        await cargarMesa();
    }

    window.addEventListener('beforeunload', () => {
        if (reintentoSincronizacion) clearInterval(reintentoSincronizacion);
        if (refrescoRespaldoMesa) clearInterval(refrescoRespaldoMesa);
        if (reintentoRealtimeMesa) clearTimeout(reintentoRealtimeMesa);
        if (temporizadorCargaRealtimeMesa) clearTimeout(temporizadorCargaRealtimeMesa);
        if (temporizadorAvisoCambioRemoto) clearTimeout(temporizadorAvisoCambioRemoto);
        limpiarCanalRealtimeMesa();
    });

</script>
