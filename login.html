<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="offline-mode.js"></script>
    <script src="vista-app.js"></script>
    <title>Club Dominó y Romo — Acceso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f1f5f9">
    <!-- Archivo de caché centralizado -->
    <script src="cache.js"></script>
    <script>
        // Carga inmediata del tema antes de renderizar
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
    <style>
    :root {
        --bg-color: #0b1120;
        --card-bg: #152238;
        --input-bg: #1e2d4a;
        --border-color: #263859;
        
        --accent-blue: #2563eb;
        --accent-blue-hover: #1d4ed8;
        --accent-green: #10b981;
        --accent-green-hover: #059669;
        --accent-red: #ef4444;
        --accent-purple: #8b5cf6;
        --accent-amber: #f59e0b;
        
        --text: #ffffff;
        --text-muted: #8e9bb0;
        --cyan-title: #38bdf8;

        --sub-bg: #0d1726;
        --score-bg: #152238;
        --table-border: rgba(255,255,255,0.05);
        --progress-bg: #0b1120;
    }

    html.light-mode {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --input-bg: #f8fafc;
        --border-color: #cbd5e1;
        
        --text: #0f172a;
        --text-muted: #64748b;
        --cyan-title: #0284c7;

        --sub-bg: #f8fafc;
        --score-bg: #f1f5f9;
        --table-border: rgba(0,0,0,0.08);
        --progress-bg: #e2e8f0;
    }

    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body { 
        background-color: var(--bg-color); 
        color: var(--text); 
        padding: 16px 12px; 
        display: flex; 
        justify-content: center; 
    }

    .container { 
        width: 100%; 
        max-width: 520px; 
        display: flex; 
        flex-direction: column; 
        gap: 16px; 
    } 
    
    header { 
        text-align: center; 
        padding: 8px 0 12px 0; 
    }
    header h1 { 
        font-size: 2rem; 
        font-weight: 900; 
        color: var(--cyan-title); 
        letter-spacing: -0.5px;
    }
    header p { 
        color: var(--text-muted); 
        font-size: 0.9rem; 
        margin-top: 2px;
    }

    .card { 
        background: var(--card-bg); 
        border-radius: 16px; 
        padding: 18px; 
        border: 1px solid var(--border-color); 
    }

    .galardon-card {
        background: linear-gradient(135deg, #1c1404, #2c1a04);
        border: 1px solid #f59e0b;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
    }
    .galardon-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }
    .galardon-header h3 {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--accent-amber);
    }
    .on-fire-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.25);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .auth-tabs-box {
        background: var(--sub-bg);
        padding: 6px;
        border-radius: 12px;
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        border: 1px solid var(--border-color);
    }
    
    .tab-btn { 
        flex: 1; 
        min-height: 42px; 
        background: transparent; 
        border: none; 
        color: var(--text-muted); 
        font-size: 0.95rem; 
        font-weight: 700; 
        cursor: pointer; 
        border-radius: 8px; 
        transition: all 0.2s;
    }
    .tab-btn.active { 
        background: var(--accent-blue); 
        color: white; 
    }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    
    input, select { 
        width: 100%; 
        padding: 12px 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border-color); 
        background: var(--input-bg); 
        color: var(--text); 
        font-size: 1rem; 
        outline: none;
    }
    input::placeholder { color: var(--text-muted); opacity: 0.7; }
    input:focus, select:focus { border-color: var(--accent-blue); }

    .btn { 
        width: 100%; 
        min-height: 48px; 
        padding: 12px; 
        border: none; 
        border-radius: 10px; 
        font-weight: 800; 
        cursor: pointer; 
        background: var(--accent-blue); 
        color: white; 
        font-size: 1rem; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px;
        text-decoration: none; 
        transition: opacity 0.2s; 
    }
    .btn:active { opacity: 0.85; }
    .btn-green { background: var(--accent-green); }
    .btn-secondary { background: var(--input-bg); color: var(--text); border: 1px solid var(--border-color); }
    .btn-danger { background: var(--accent-red); }
    .btn-admin { background: var(--accent-purple); color: white; }
    .btn-amber { background: var(--accent-amber); color: #000; }

    .user-info-bar { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background: var(--sub-bg); 
        padding: 12px 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border-color);
    }
    
    .equipos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .equipo-card-box { 
        background: var(--sub-bg); 
        border: 1px solid var(--border-color); 
        border-radius: 10px; 
        padding: 12px; 
        display: flex; 
        flex-direction: column; 
        gap: 8px; 
    }
    .equipo-card-box h4 { font-size: 0.85rem; font-weight: 800; color: var(--cyan-title); }

    .filtros-box {
        background: var(--sub-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .filtro-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .filtro-item.full-width {
        grid-column: span 2;
    }
    .filtro-item label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .filtro-item input, .filtro-item select {
        padding: 8px 10px;
        font-size: 0.85rem;
        border-radius: 8px;
        background: var(--input-bg);
    }
    .btn-limpiar-filtros {
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border-color);
        font-weight: 700;
        font-size: 0.85rem;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition: background 0.2s;
        min-height: 38px;
    }
    .btn-limpiar-filtros:hover {
        opacity: 0.8;
    }

    .tabla-stats { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; margin-top: 6px; }
    .tabla-stats th { padding: 10px 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .tabla-stats td { padding: 10px 8px; border-bottom: 1px solid var(--table-border); vertical-align: middle; }
    .progress-container { display: flex; align-items: center; gap: 8px; }
    .progress-bar-bg { flex-grow: 1; background: var(--progress-bg); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
    .progress-bar-fill { height: 100%; background: var(--accent-green); border-radius: 4px; }
    .eficiencia-txt { min-width: 42px; text-align: right; font-weight: bold; font-size: 0.75rem; }

    .mesas-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .mesa-card-vivo { 
        background: var(--sub-bg); 
        border: 1px solid var(--border-color); 
        border-radius: 12px; 
        padding: 14px; 
        display: flex; 
        flex-direction: column; 
        gap: 12px; 
    }
    
    .marcador-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .equipo-score-box { 
        background: var(--score-bg); 
        border-radius: 10px; 
        padding: 10px; 
        border: 1px solid var(--border-color);
    }
    .equipo-score-box.team-a { border-color: rgba(56, 189, 248, 0.4); }
    .equipo-score-box.team-b { border-color: rgba(239, 68, 68, 0.4); }
    
    .score-a { color: var(--cyan-title); font-size: 2rem; font-weight: 900; line-height: 1; margin-top: 6px; }
    .score-b { color: var(--accent-red); font-size: 2rem; font-weight: 900; line-height: 1; margin-top: 6px; }

    .progress-track { width: 100%; height: 8px; background: var(--progress-bg); border-radius: 6px; overflow: hidden; margin-top: 4px; border: 1px solid var(--border-color); }
    .progress-fill { height: 100%; background: var(--accent-green); transition: width 0.3s ease; }

    .hidden { display: none !important; }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .status-aprobado { background: #065f46; color: #34d399; }
    .status-pendiente { background: #854d0e; color: #fef08a; }
    
    .cumple-banner {
        background: linear-gradient(135deg, #1e1b4b, #312e81);
        border: 1px solid #6366f1;
        border-radius: 14px;
        padding: 14px;
        text-align: center;
        color: #e0e7ff;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        animation: pulse-glow 2s infinite;
    }
    @keyframes pulse-glow {
        0% { border-color: #6366f1; }
        50% { border-color: #a5b4fc; box-shadow: 0 4px 20px rgba(165, 180, 252, 0.4); }
        100% { border-color: #6366f1; }
    }

    /* =========================================================
       LOGIN 2026 — alineado con Lobby, Mesa y Torneos
       ========================================================= */
    :root {
        --login-surface: rgba(15, 29, 49, 0.92);
        --login-surface-soft: #111f35;
        --login-line: rgba(148, 163, 184, 0.20);
        --login-blue: #38bdf8;
        --login-green: #34d399;
        --login-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
    }

    html.light-mode {
        --login-surface: rgba(255, 255, 255, 0.94);
        --login-surface-soft: #f3f7fc;
        --login-line: #cfdaea;
        --login-blue: #087fc1;
        --login-green: #059669;
        --login-shadow: 0 10px 30px rgba(44, 72, 112, 0.07);
    }

    body {
        min-height: 100dvh;
        padding: 14px 10px 28px;
        align-items: flex-start;
        background:
            radial-gradient(circle at 12% 0%, rgba(59, 130, 246, 0.13), transparent 35%),
            radial-gradient(circle at 92% 20%, rgba(16, 185, 129, 0.10), transparent 32%),
            var(--bg-color);
    }

    .login-shell {
        width: 100%;
        max-width: 570px;
        display: grid;
        gap: 14px;
    }

    .brand-card,
    .auth-card {
        border: 1px solid var(--login-line);
        background: var(--login-surface);
        box-shadow: var(--login-shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    .brand-card {
        position: relative;
        padding: 8px 18px 4px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        text-align: center;
    }

    .brand-row {
        display: block;
    }

    .brand-lockup {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
    }

    .brand-logo {
        width: 190px;
        height: 190px;
        object-fit: contain;
        flex: 0 0 auto;
    }

    .brand-copy {
        min-width: 0;
        margin-top: -52px;
    }
    .brand-copy h1 {
        margin: 0;
        color: var(--login-blue);
        font-size: clamp(1.35rem, 5vw, 1.8rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 900;
    }

    .brand-copy p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 0.78rem;
        line-height: 1.35;
    }

    .theme-toggle {
        position: absolute;
        top: 15px;
        right: 15px;
        min-width: 108px;
        min-height: 44px;
        padding: 9px 12px;
        border-radius: 13px;
        border: 1px solid var(--login-line);
        background: var(--login-surface-soft);
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
    }

    .auth-card {
        padding: 19px;
        border-radius: 22px;
    }

    .auth-intro { display: none; }
    .eyebrow {
        display: block;
        margin-bottom: 4px;
        color: var(--login-blue);
        font-size: 0.66rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .auth-intro h2 {
        color: var(--text);
        font-size: 1.35rem;
        line-height: 1.15;
        letter-spacing: -0.025em;
    }

    .auth-intro p {
        margin-top: 5px;
        color: var(--text-muted);
        font-size: 0.82rem;
        line-height: 1.45;
    }

    .auth-tabs-box {
        padding: 5px;
        margin-bottom: 17px;
        border-color: var(--login-line);
        background: var(--login-surface-soft);
        border-radius: 13px;
    }

    .tab-btn {
        min-height: 44px;
        border-radius: 9px;
        font-size: 0.88rem;
        transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .tab-btn.active {
        border: 1px solid rgba(56, 189, 248, 0.30);
        background: rgba(56, 189, 248, 0.12);
        color: var(--login-blue);
    }

    form { gap: 13px; }
    .field-group { display: grid; gap: 6px; }
    .field-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    label {
        color: var(--text-muted);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.83rem;
        font-weight: 500;
        letter-spacing: 0;
    }

    input, select {
        min-height: 50px;
        padding: 12px 14px;
        border-color: var(--login-line);
        border-radius: 13px;
        background: var(--login-surface-soft);
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus, select:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.11);
    }

    .password-field { position: relative; }
    .password-field input { padding-right: 56px; }
    .password-toggle {
        position: absolute;
        top: 50%;
        right: 7px;
        transform: translateY(-50%);
        width: 42px;
        height: 38px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1rem;
    }

    .password-toggle svg {
        width: 21px;
        height: 21px;
        display: block;
        margin: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .forgot-link {
        color: var(--login-blue);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.79rem;
        font-weight: 400;
        letter-spacing: 0;
        text-decoration: none;
    }

    .btn {
        min-height: 50px;
        border-radius: 13px;
        font-size: 0.94rem;
        box-shadow: none;
        transition: transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    .btn:not(:disabled):active { transform: scale(0.99); }
    .btn:disabled { cursor: wait; opacity: 0.66; }
    .btn-primary-login {
        border: 1px solid rgba(14, 165, 233, 0.34);
        background: linear-gradient(135deg, #10b981, #0ea5e9);
        color: white;
    }

    .auth-message {
        margin-bottom: 13px;
        padding: 11px 12px;
        border: 1px solid var(--login-line);
        border-radius: 12px;
        background: var(--login-surface-soft);
        color: var(--text);
        font-size: 0.79rem;
        line-height: 1.4;
    }

    .auth-message.error {
        border-color: rgba(239, 68, 68, 0.28);
        background: var(--redSoft, rgba(239, 68, 68, 0.10));
        color: #ef4444;
    }

    .auth-message.success {
        border-color: rgba(16, 185, 129, 0.30);
        background: rgba(16, 185, 129, 0.10);
        color: var(--login-green);
    }

    .alternate-access {
        margin-top: 17px;
        padding-top: 16px;
        border-top: 1px solid var(--login-line);
    }

    .alternate-label {
        display: block;
        margin-bottom: 9px;
        color: var(--text-muted);
        font-size: 0.69rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .access-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .access-option {
        min-width: 0;
        min-height: 70px;
        padding: 11px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        align-items: center;
        gap: 9px;
        border: 1px solid var(--login-line);
        border-radius: 13px;
        background: var(--login-surface-soft);
        color: var(--text);
        text-align: left;
        text-decoration: none;
        cursor: pointer;
    }

    .access-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(56, 189, 248, 0.10);
        font-size: 1.05rem;
    }

    .access-option strong {
        display: block;
        font-size: 0.78rem;
        line-height: 1.2;
    }

    .access-option small {
        display: block;
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 0.65rem;
        line-height: 1.3;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
        outline: 3px solid rgba(56, 189, 248, 0.24);
        outline-offset: 2px;
    }

    @media (max-width: 460px) {
        body { padding: 10px 8px 24px; }
        .login-shell { gap: 12px; }
        .brand-card { padding: 5px 14px 2px; }
        .brand-lockup { gap: 5px; }
        .brand-logo { width: 154px; height: 154px; }
        .brand-copy { margin-top: -42px; }
        .brand-copy h1 { font-size: 1.25rem; }
        .brand-copy p { font-size: 0.69rem; }
        .theme-toggle { min-width: 74px; padding: 8px 9px; }
        .theme-label { display: none; }
        .auth-card { padding: 16px 14px; border-radius: 19px; }
        .access-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            scroll-behavior: auto !important;
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
    </style>
</head>

<body>
<main class="login-shell">
    <header class="brand-card">
        <div class="brand-row">
            <div class="brand-lockup">
                <img class="brand-logo" src="logo.png" alt="Logo del Club Dominó y Romo">
                <div class="brand-copy">
                    <h1>Club Dominó y Romo</h1>
                    <p>Sistema de Anote y Estadísticas</p>
                </div>
            </div>
            <button
                id="login-theme-toggle"
                class="theme-toggle"
                type="button"
                onclick="cambiarTemaLogin()"
                aria-label="Cambiar tema"
            >
                <span class="theme-icon">☀️</span>
                <span class="theme-label">Claro</span>
            </button>
        </div>
    </header>

    <section id="auth-section" class="auth-card" aria-labelledby="auth-title">
        <div class="auth-intro">
            <span id="auth-eyebrow" class="eyebrow">Bienvenido</span>
            <h2 id="auth-title">Entra al club</h2>
            <p id="auth-subtitle">Accede a tus partidas, estadísticas y torneos.</p>
        </div>

        <div id="auth-message" class="auth-message hidden" role="status" aria-live="polite"></div>

        <div class="auth-tabs-box" id="tabs-header" role="tablist" aria-label="Opciones de acceso">
            <button
                id="login-tab"
                class="tab-btn active"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="login-form"
                onclick="switchTab('login')"
            >Iniciar sesión</button>
            <button
                id="register-tab"
                class="tab-btn"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="register-form"
                onclick="switchTab('register')"
            >Registrarse</button>
        </div>

        <form id="login-form" onsubmit="loginUsuario(event)" novalidate>
            <div class="field-group">
                <label for="login-email">Correo electrónico</label>
                <input
                    type="email"
                    id="login-email"
                    required
                    autocomplete="email"
                    inputmode="email"
                    autocapitalize="none"

                    <label for="login-password">Contraseña</label>

                <div class="password-field">

                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>

                <input

                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Ej. JuanP23"
                >

            <div class="field-group">
                <label for="reg-email">Correo electrónico</label>
                <input
                    type="email"
                    id="reg-email"
                    required
                    autocomplete="email"
                    inputmode="email"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="correo@ejemplo.com"
                >
            </div>
            <div class="field-group">
                <label for="reg-password">Contraseña</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="reg-password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="Mínimo 6 caracteres"
                    >
                    <button
                        class="password-toggle"
                        type="button"
                        onclick="togglePassword('reg-password',this)"
                        aria-label="Mostrar contraseña"
                        title="Mostrar contraseña"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>

            </div>
            <button id="register-submit" type="submit" class="btn btn-primary-login">Crear cuenta</button>

        <form id="recovery-form" class="hidden" onsubmit="guardarNuevaClave(event)" novalidate>
            <div class="field-group">
                <label for="new-password">Nueva contraseña</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="new-password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="Mínimo 6 caracteres"
                    >
                    <button
                        class="password-toggle"
                        type="button"
                        onclick="togglePassword('new-password',this)"
                        aria-label="Mostrar contraseña"
                        title="Mostrar contraseña"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>

            <button id="recovery-submit" type="submit" class="btn btn-primary-login">Guardar nueva contraseña</button>

        <div id="alternate-access" class="alternate-access">

                    <span class="access-icon">👀</span>

                        <strong>Modo invitado</strong>
                        <small>Consulta información sin realizar cambios.</small>

                    <span class="access-icon">🎲</span>

</main>
<script>
const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function actualizarTemaLogin() {
        const claro = document.documentElement.classList.contains('light-mode');
        const boton = document.getElementById('login-theme-toggle');
        const metaTheme = document.querySelector('meta[name="theme-color"]');

        if (boton) {
            boton.querySelector('.theme-icon').textContent = claro ? '☀️' : '🌙';
            boton.querySelector('.theme-label').textContent = claro ? 'Claro' : 'Oscuro';
            boton.setAttribute('aria-label', claro ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro');
            boton.title = claro ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
        }

        if (metaTheme) metaTheme.content = claro ? '#f1f5f9' : '#0b1120';
    }

    function cambiarTemaLogin() {
        document.documentElement.classList.toggle('light-mode');
        const tema = document.documentElement.classList.contains('light-mode') ? 'light' : 'dark';
        localStorage.setItem('theme', tema);
        actualizarTemaLogin();
    }

    const PASSWORD_EYE_ICON = `
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>`;

    const PASSWORD_EYE_OFF_ICON = `
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
            <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2 3.2"></path>
            <path d="M6.6 6.6C3.6 8.6 2 12 2 12s3 8 10 8a10.5 10.5 0 0 0 5.4-1.5"></path>
        </svg>`;

    function togglePassword(inputId, boton) {
        const input = document.getElementById(inputId);
        if (!input || !boton) return;

        const mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        boton.innerHTML = mostrar ? PASSWORD_EYE_OFF_ICON : PASSWORD_EYE_ICON;
        boton.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
        boton.title = mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña';
    }

    function mostrarMensaje(texto = '', tipo = 'info') {
        const mensaje = document.getElementById('auth-message');
        if (!mensaje) return;

        mensaje.textContent = texto;
        mensaje.className = `auth-message ${tipo}${texto ? '' : ' hidden'}`;
    }

    function limpiarMensaje() {
        mostrarMensaje('');
    }

    function cambiarCargaBoton(boton, cargando, textoCarga = 'Procesando…') {
        if (!boton) return;

        if (cargando) {
            boton.dataset.textoOriginal = boton.textContent;
            boton.textContent = textoCarga;
            boton.disabled = true;
            boton.setAttribute('aria-busy', 'true');
        } else {
            boton.textContent = boton.dataset.textoOriginal || boton.textContent;
            boton.disabled = false;
            boton.removeAttribute('aria-busy');
        }
    }

    function validarFormulario(formulario) {
        if (formulario.checkValidity()) return true;
        formulario.reportValidity();
        return false;
    }

    function mensajeErrorAuth(error, mensajeBase) {
        const detalle = String(error?.message || '').toLowerCase();

        if (detalle.includes('invalid login credentials')) return 'El correo o la contraseña no son correctos.';
        if (detalle.includes('email not confirmed')) return 'Confirma tu correo electrónico antes de entrar.';
        if (detalle.includes('user already registered')) return 'Ya existe una cuenta registrada con ese correo.';
        if (detalle.includes('password should be')) return 'La contraseña debe tener al menos 6 caracteres.';
        if (detalle.includes('failed to fetch') || detalle.includes('network')) return 'No pudimos conectar. Revisa tu internet e inténtalo otra vez.';

        return mensajeBase;
    }

    function switchTab(tab, borrarMensaje = true) {
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const esLogin = tab === 'login';

        loginTab.classList.toggle('active', esLogin);
        loginTab.setAttribute('aria-selected', String(esLogin));
        registerTab.classList.toggle('active', !esLogin);
        registerTab.setAttribute('aria-selected', String(!esLogin));
        document.getElementById('recovery-form').classList.add('hidden');
        document.getElementById('tabs-header').classList.remove('hidden');
        document.getElementById('alternate-access').classList.remove('hidden');

        document.getElementById('login-form').classList.toggle('hidden', !esLogin);
        document.getElementById('register-form').classList.toggle('hidden', esLogin);
        document.getElementById('auth-eyebrow').textContent = esLogin ? 'Bienvenido' : 'Únete al club';
        document.getElementById('auth-title').textContent = esLogin ? 'Entra al club' : 'Crea tu cuenta';
        document.getElementById('auth-subtitle').textContent = esLogin
            ? 'Accede a tus partidas, estadísticas y torneos.'
            : 'Elige tu alias y solicita acceso para comenzar a jugar.';

        if (borrarMensaje) limpiarMensaje();
    }

    function mostrarFormularioRecuperacion() {
        const authSection = document.getElementById('auth-section');
        const tabsHeader = document.getElementById('tabs-header');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const recoveryForm = document.getElementById('recovery-form');

        if (authSection) authSection.classList.remove('hidden');
        if (tabsHeader) tabsHeader.classList.add('hidden');
        if (loginForm) loginForm.classList.add('hidden');
        if (registerForm) registerForm.classList.add('hidden');
        if (recoveryForm) recoveryForm.classList.remove('hidden');
        document.getElementById('alternate-access')?.classList.add('hidden');
        document.getElementById('auth-eyebrow').textContent = 'Seguridad';
        document.getElementById('auth-title').textContent = 'Crea una nueva contraseña';
        document.getElementById('auth-subtitle').textContent = 'Actualiza tu clave para recuperar el acceso a tu cuenta.';
        limpiarMensaje();
    }

    async function loginUsuario(e) {
        e.preventDefault();
        const formulario = e.currentTarget;
        const boton = document.getElementById('login-submit');
        if (!validarFormulario(formulario)) return;

        limpiarMensaje();
        cambiarCargaBoton(boton, true, 'Entrando…');

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                mostrarMensaje(mensajeErrorAuth(error, 'No fue posible iniciar sesión.'), 'error');
                return;
            }

            mostrarMensaje('Acceso correcto. Abriendo el lobby…', 'success');
            localStorage.removeItem('modo_invitado');
            window.location.href = 'lobby.html';
        } catch (error) {
            mostrarMensaje(mensajeErrorAuth(error, 'No fue posible iniciar sesión.'), 'error');
        } finally {
            cambiarCargaBoton(boton, false);
        }
    }

    async function recuperarClave(e) {
        if (e) e.preventDefault();
        const emailInput = document.getElementById('login-email');
        const email = emailInput.value.trim();
        
        if (!email || !emailInput.checkValidity()) {
            mostrarMensaje('Escribe primero un correo electrónico válido.', 'error');
            emailInput.focus();
            emailInput.reportValidity();
            return;
        }

        const redirectUrl = new URL('login.html', window.location.href).href;
        mostrarMensaje('Enviando enlace de recuperación…');

        try {
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl
            });

            if (error) {
                mostrarMensaje(mensajeErrorAuth(error, 'No pudimos enviar el enlace de recuperación.'), 'error');
                return;
            }

            mostrarMensaje('Revisa tu correo. Te enviamos un enlace para crear una nueva contraseña.', 'success');
        } catch (error) {
            mostrarMensaje(mensajeErrorAuth(error, 'No pudimos enviar el enlace de recuperación.'), 'error');
        }
    }

    async function guardarNuevaClave(e) {
        e.preventDefault();
        const formulario = e.currentTarget;
        const newPassInput = document.getElementById('new-password');
        const boton = document.getElementById('recovery-submit');
        if (!newPassInput || !validarFormulario(formulario)) return;

        limpiarMensaje();
        cambiarCargaBoton(boton, true, 'Guardando…');
        const newPassword = newPassInput.value;

        try {
            const { error } = await supabase.auth.updateUser({ password: newPassword });

            if (error) {
                mostrarMensaje(mensajeErrorAuth(error, 'No pudimos actualizar la contraseña.'), 'error');
                return;
            }

            mostrarMensaje('Contraseña actualizada. Ahora podrás entrar con tu nueva clave.', 'success');
            await supabase.auth.signOut();
            window.setTimeout(() => {
                window.history.replaceState({}, document.title, window.location.pathname);
                location.reload();
            }, 900);
        } catch (error) {
            mostrarMensaje(mensajeErrorAuth(error, 'No pudimos actualizar la contraseña.'), 'error');
        } finally {
            cambiarCargaBoton(boton, false);
        }
    }

    async function registrarUsuario(e) {
        e.preventDefault();
        const formulario = e.currentTarget;
        const boton = document.getElementById('register-submit');
        if (!validarFormulario(formulario)) return;

        limpiarMensaje();
        cambiarCargaBoton(boton, true, 'Creando cuenta…');

        const nombre = document.getElementById('reg-nombre').value.trim();
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        try {
            const { error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        nombre_completo: nombre,
                        username: username
                    }
                }
            });

            if (error) {
                mostrarMensaje(mensajeErrorAuth(error, 'No fue posible crear la cuenta.'), 'error');
                return;
            }

            document.getElementById('login-email').value = email;
            switchTab('login', false);
            mostrarMensaje('Cuenta creada. Un administrador deberá aprobarla antes de que puedas jugar.', 'success');
        } catch (error) {
            mostrarMensaje(mensajeErrorAuth(error, 'No fue posible crear la cuenta.'), 'error');
        } finally {
            cambiarCargaBoton(boton, false);
        }
    }

    function entrarModoInvitado() {
        localStorage.setItem('modo_invitado', 'true');
        window.location.href = 'lobby.html';
    }
window.addEventListener('DOMContentLoaded', async () => {
    let modoRecuperacion = false;
    actualizarTemaLogin();

    // Registrar el listener antes de consultar la sesión.
    supabase.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
            modoRecuperacion = true;
            mostrarFormularioRecuperacion();
        }
    });

    const params = new URLSearchParams(window.location.search);
    const hash = window.location.hash || '';

    const hasCode = params.has('code');
    const hasRecoveryType =
        params.get('type') === 'recovery' ||
        /(?:^|[&#])type=recovery(?:[&#]|$)/i.test(hash);

    const hasAccessToken =
        /(?:^|[&#])access_token=/i.test(hash);

    if (hasCode || hasRecoveryType || hasAccessToken) {
        modoRecuperacion = true;
        mostrarFormularioRecuperacion();
    }

    const { data: { session }, error: sessionError } = await supabase.auth.getSession();

    if (sessionError) {
        mostrarMensaje(mensajeErrorAuth(sessionError, 'No pudimos comprobar la sesión guardada.'), 'error');
    }

    // Nunca enviar al lobby durante una recuperación.
    if (!modoRecuperacion && session) {
        window.location.replace('lobby.html');
        return;
    }

    if (!modoRecuperacion) {
        const authSection = document.getElementById('auth-section');
        if (authSection) authSection.classList.remove('hidden');
    }
});
</script>
</body>
